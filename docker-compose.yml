# Pocket Watch — films and shows for the household on top of Jellyfin. Go + SQLite. One container, one volume.
services:
  pocket-watch:
    image: ghcr.io/abjelosevic88/pocket-homelab-watch:latest
    container_name: pocket-watch
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      # SECURE_COOKIES: "true"          # behind HTTPS
      # Your Jellyfin. Everyone signs in with their own account on it (Settings → Jellyfin).
      JELLYFIN_URL: ${JELLYFIN_URL:-http://jellyfin:8096}
      JELLYFIN_PUBLIC_URL: ${JELLYFIN_PUBLIC_URL:-}
      # First admin (only used while the database has no users):
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # The admin's own Jellyfin account, copied once into their connection:
      # an API key + the account it acts as, or a username + password.
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
      JELLYFIN_USER: ${JELLYFIN_USER:-}
      JELLYFIN_PASSWORD: ${JELLYFIN_PASSWORD:-}
      # The box's services (also under Settings → Services):
      JELLYSEERR_URL: ${JELLYSEERR_URL:-}
      JELLYSEERR_API_KEY: ${JELLYSEERR_API_KEY:-}
      SONARR_URL: ${SONARR_URL:-}
      SONARR_API_KEY: ${SONARR_API_KEY:-}
      RADARR_URL: ${RADARR_URL:-}
      RADARR_API_KEY: ${RADARR_API_KEY:-}
      MAINTAINERR_URL: ${MAINTAINERR_URL:-}
      NOTIFY_URL: ${NOTIFY_URL:-}
      # Pocket Core: one sign-in, Jellyfin logins per person, Pocket AI.
      # CORE_URL: http://pocket-core:8080
      # CORE_REGISTRATION_KEY: ${CORE_REGISTRATION_KEY}
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
